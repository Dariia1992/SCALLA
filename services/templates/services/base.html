
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SCALLA | IT Solutions</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{% static 'services/css/custom.css' %}?v=10"
    >
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header class="scalla-header">

        <nav class="container scalla-nav">

            <!-- Логотип -->
            <a href="{% url 'home' %}" class="scalla-logo">
                <span class="logo-symbol">◢</span>
                SCALLA
            </a>

            <!-- Навигация -->
            <ul class="scalla-menu">

                <li>
                    <a href="{% url 'home' %}" class="active">
                        Home
                    </a>
                </li>

                <li>
                    <a href="{% url 'home' %}#services">
                        Services
                    </a>
                </li>

                <li>
                    <a href="{% url 'home' %}#about">
                        About
                    </a>
                </li>

                <li>
                    <a href="{% url 'home' %}#work">
                        Our Work
                    </a>
                </li>

                <li>
                    <a href="{% url 'home' %}#contacts">
                        Contact
                    </a>
                </li>

            </ul>

            <!-- Кнопка связи -->
            <a
                href="{% url 'home' %}#contacts"
                class="scalla-btn nav-btn"
            >
                Get in Touch →
            </a>

        </nav>

    </header>

    <!-- ================= PAGE CONTENT ================= -->
    <main>

        {% block content %}
        {% endblock %}

    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="scalla-footer">

        <div class="container">
            © 2026 SCALLA. All Rights Reserved.
        </div>

    </footer>

    <!-- ================= BOOTSTRAP JS ================= -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
